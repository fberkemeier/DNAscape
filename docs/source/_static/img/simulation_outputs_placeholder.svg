<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Placeholder simulation outputs</title>
  <desc id="desc">A placeholder dashboard-like arrangement of simulated replication outputs.</desc>
  <rect width="960" height="420" fill="#f7f8fa"/>
  <rect x="56" y="40" width="848" height="324" rx="8" fill="#ffffff" stroke="#cfd6df"/>
  <text x="78" y="76" font-family="Arial, sans-serif" font-size="22" fill="#22313f">Simulation outputs</text>
  <text x="78" y="103" font-family="Arial, sans-serif" font-size="13" fill="#5c6773">Placeholder: timing, efficiency, replicated fraction, and fork counts.</text>
  <g transform="translate(92 130)">
