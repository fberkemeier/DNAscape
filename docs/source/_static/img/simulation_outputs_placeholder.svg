    <path d="M24 66 C84 28 122 70 174 44 S272 48 316 28" fill="none" stroke="#2d6cdf" stroke-width="4"/>
    <text x="20" y="24" font-family="Arial, sans-serif" font-size="13" fill="#22313f">replication timing</text>
  </g>
  <g transform="translate(512 130)">
