    <path d="M24 74 C92 24 138 78 196 40 S274 44 316 66" fill="none" stroke="#6f4aa8" stroke-width="4"/>
    <text x="20" y="24" font-family="Arial, sans-serif" font-size="13" fill="#22313f">active forks</text>
