[build-system]
# Build wheels in temporary archives instead of reusing the checkout's build/.
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "dnascape"
version = "1.0.0"
description = "DNAscape: tools for modelling and simulating DNA replication kinetics."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "Francisco Berkemeier" },
]

dependencies = [
  # Fitting uses numpy.trapezoid, introduced in NumPy 2.0.
  "numpy>=2.0",
  "pandas",
  "matplotlib",
  "scipy",
]

[project.optional-dependencies]
genomics = [
  "pyBigWig",
]
app = [
  "nicegui>=3.12,<4",
  "py7zr>=1,<2",
  # Vector PDF export needs no Cairo; svglib 1.6 adds its bitmap backend.
  "svglib>=1.5.1,<1.6",
  # Select a BigWig reader with wheels for the active Python interpreter.
  "pybigtools>=0.3,<0.4; python_version >= '3.10' and python_version < '3.14'",
  "figwig>=0.2,<0.3; python_version >= '3.14'",
]
test = [
  "pytest>=8",
  # Verify that installed wheels contain the headless workflow subpackage.
  "hatchling>=1.27",
  # Exercise the local NiceGUI interface with its real component tree.
  "nicegui>=3.12,<4",
  "py7zr>=1,<2",
  "svglib>=1.5.1,<1.6",
  "pybigtools>=0.3,<0.4; python_version >= '3.10' and python_version < '3.14'",
  "figwig>=0.2,<0.3; python_version >= '3.14'",
]

[project.urls]
Documentation = "https://dnascape.readthedocs.io/en/latest/"
Repository = "https://github.com/fberkemeier/DNAscape"
Issues = "https://github.com/fberkemeier/DNAscape/issues"

[project.scripts]
dnascape = "dnascape.cli:main"

[tool.hatch.build]
exclude = ["/dnascape/tests"]

[tool.hatch.build.targets.wheel]
packages = ["dnascape"]

[tool.hatch.build.targets.sdist]
only-include = ["dnascape", "pyproject.toml", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["dnascape/tests", "app/tests"]
addopts = "-ra"

[tool.pyright]
# The local front end is the typed application boundary.  The historical
# scientific modules remain dynamically typed and are covered by numerical
# regression tests instead of being hidden among hundreds of low-signal union
# diagnostics.
include = ["app"]
exclude = [".venv", ".pytest_cache"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingTypeStubs = "none"

[tool.ruff]
target-version = "py39"
line-length = 100
extend-exclude = [".venv", ".pytest_cache", ".ruff_cache"]

[tool.ruff.lint]
# Keep editor diagnostics focused on correctness, unsafe defaults, and imports.
select = ["E9", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# This compatibility facade intentionally re-exports the legacy public API.
"dnascape/core.py" = ["F403"]
